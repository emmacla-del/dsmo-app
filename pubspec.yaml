name: dsmo_app
description: "CAMLEAP — Cameroon Labour and Employment Analytical Platform. Labour Market Intelligence."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2

  # --- Layout & Grid ---
  flutter_layout_grid: ^2.0.5

  # --- State management & networking ---
  flutter_riverpod: ^2.4.0
  dio: ^5.3.0
  http: ^1.1.0
  connectivity_plus: ^6.0.0

  # --- Routing ---
  go_router: ^14.0.0

  # --- Local storage ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- Utilities ---
  intl: ^0.20.2
  url_launcher: ^6.1.0

  # --- File handling & export ---
  file_picker: ^8.0.0
  excel: ^4.0.0
  path_provider: ^2.1.0
  share_plus: ^10.1.0

  # --- Charts & PDF ---
  fl_chart: ^0.63.0
  pdf: ^3.10.4
  printing: ^5.9.0
  syncfusion_flutter_pdfviewer: ^28.2.12

  # --- UI / Fonts & Animations ---
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  open_file: ^3.3.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: assets/images/camleap_logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  web:
    generate: true
    image_path: assets/images/camleap_logo.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/onefop_logo.png
    - assets/images/camleap_logo.png
    - assets/fonts/

  fonts:
  - family: Inter
    fonts:
      - asset: assets/fonts/Inter.ttf
      - asset: assets/fonts/Inter-Italic.ttf
        style: italic
  # Manrope, the wizard's and the polished fields' face: bundled so the
  # form looks the same offline (it was fetched from Google at runtime).
  # Static instances of the OFL variable font; licence in Manrope-OFL.txt.
  - family: Manrope
    fonts:
      - asset: assets/fonts/Manrope-Regular.ttf
      - asset: assets/fonts/Manrope-Medium.ttf
        weight: 500
      - asset: assets/fonts/Manrope-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Manrope-Bold.ttf
        weight: 700
      - asset: assets/fonts/Manrope-ExtraBold.ttf
        weight: 800