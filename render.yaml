services:
  - type: web
    name: dsmo-app-frontend
    runtime: static
    buildCommand: |
      git clone https://github.com/flutter/flutter.git -b 3.41.5 --depth 1 /opt/flutter
      export PATH="/opt/flutter/bin:$PATH"
      flutter pub get
      flutter build web --release
    staticPublishPath: build/web
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
