services:
  - type: web
    name: dsmo-app-frontend
    runtime: static
    buildCommand: |
      git clone https://github.com/flutter/flutter.git -b 3.41.5 --depth 1 flutter-sdk
      export PATH="$PWD/flutter-sdk/bin:$PATH"
      flutter pub get
      flutter build web --release
    staticPublishPath: build/web
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: dsmo-react-web
    runtime: node
    plan: starter
    rootDir: react-web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://dsmo-app-2.onrender.com/api
    buildFilter:
      paths:
        - react-web/**